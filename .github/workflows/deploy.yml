name: GitHub Pages へデプロイ

# main への push で Vite ビルドを書き出し、GitHub Pages へ公開する。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node 24 を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Pages 設定（未有効なら有効化）
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 型チェックとビルド（base は vite.config.ts の /karada-log/）
        run: npm run build

      - name: 成果物をアップロード
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
