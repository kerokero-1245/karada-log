name: GitHub Pages へデプロイ

# lint・テスト・ビルドを通ったときだけ、Vite ビルドを書き出して GitHub Pages へ公開する。
# main への push と手動実行で公開する。PR では検査（lint・テスト・ビルド）だけを回し、公開はしない。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node 24 を用意
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Lint（oxlint）
        run: npm run lint

      - name: テスト（node --test）
        run: npm test

      - name: Pages 設定（未有効なら有効化）
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 型チェックとビルド（base は vite.config.ts の /karada-log/）
        run: npm run build

      - name: 成果物をアップロード
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: デプロイ
        id: deployment
        uses: actions/deploy-pages@v4
